<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3c1580">
    <title>三『資』小豬 - 登入</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/admin.css">
    <!-- Marks <html> with the group count before the first frame -->
    <script src="/api/groups.js"></script>
    <!-- The floating shapes drift by the clock, so they stay in place when moving between admin pages -->
    <script>document.documentElement.style.setProperty("--drift-at", (Date.now() / 1000) % 3600 + "s");</script>
    <script src="/js/login.js" defer></script>
</head>
<body>
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
        <symbol id="sh1" viewBox="0 0 32 32"><path d="M16 3.5 30 28.5H2Z"/></symbol>
        <symbol id="sh2" viewBox="0 0 32 32"><path d="M16 1.5 30.5 16 16 30.5 1.5 16Z"/></symbol>
        <symbol id="sh3" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/></symbol>
        <symbol id="sh4" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="2.5"/></symbol>
        <symbol id="sh5" viewBox="0 0 32 32"><path d="M16 1.5 20.5 10.9 30.7 12.2 23.2 19.3 25.1 29.5 16 24.6 6.9 29.5 8.8 19.3 1.3 12.2 11.5 10.9Z"/></symbol>
        <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
        <symbol id="ic-eye-off" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M4 20 20 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
        <symbol id="ic-alert" viewBox="0 0 24 24"><path d="M12 3.5 22 20.5H2Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.4v.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    </svg>
    <div class="bg" aria-hidden="true">
        <svg class="float f1"><use href="#sh1"/></svg>
        <svg class="float f2"><use href="#sh2"/></svg>
        <svg class="float f3"><use href="#sh3"/></svg>
        <svg class="float f4"><use href="#sh4"/></svg>
    </div>

    <main class="login">
        <div class="brand">
            <p class="brand-kicker">三『資』小豬・後台</p>
            <h1 class="brand-title" aria-label="誰是猜歌王"><span style="--i:0">誰</span><span style="--i:1">是</span><span style="--i:2">猜</span><span style="--i:3">歌</span><span style="--i:4">王</span></h1>
            <div class="brand-shapes" aria-hidden="true">
                <svg class="shape" data-g="1"><use href="#sh1"/></svg><svg class="shape" data-g="2"><use href="#sh2"/></svg><svg class="shape" data-g="3"><use href="#sh3"/></svg><svg class="shape" data-g="4"><use href="#sh4"/></svg><svg class="shape" data-g="5"><use href="#sh5"/></svg>
            </div>
        </div>

        <form class="card login-card" id="login_form" novalidate>
            <h2>後台登入</h2>
            <label class="field-label" for="username">帳號</label>
            <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
            <label class="field-label" for="password">密碼</label>
            <div class="pw">
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="pw-eye" id="pw_eye" type="button" aria-label="顯示密碼" aria-pressed="false"><svg class="icon"><use href="#ic-eye"/></svg></button>
            </div>
            <p class="form-error" id="login_error" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#ic-alert"/></svg><span id="login_error_text"></span></p>
            <button class="btn" id="submit" type="submit">登入</button>
        </form>
    </main>
</body>
</html>
