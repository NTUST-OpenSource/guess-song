<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三『資』小豬 - 後台控制台</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    <script src="/js/live.js" defer></script>
    <script src="/js/scores.js" defer></script>
    <script src="/js/dashboard.js" defer></script>
    <script src="/js/quiz.js" defer></script>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <header class="top-header">
        <a class="header-title" href="/">誰是猜歌王</a>
    </header>

    <!-- Group scores: arrows save at once; typed scores save on Enter, Escape cancels -->
    <main class="score-container">
        <div class="team-card" id="t1">
            <span class="team-label">第一隊</span>
            <div class="score-editor">
                <button class="score-step up btn-green" data-group="1" data-delta="1" aria-label="第一隊加一分"></button>
                <input class="score-box" type="number" min="0" max="999" enterkeyhint="done" data-group="1" aria-label="第一隊分數">
                <button class="score-step down btn-red" data-group="1" data-delta="-1" aria-label="第一隊減一分"></button>
            </div>
        </div>
        <div class="team-card" id="t2">
            <span class="team-label">第二隊</span>
            <div class="score-editor">
                <button class="score-step up btn-green" data-group="2" data-delta="1" aria-label="第二隊加一分"></button>
                <input class="score-box" type="number" min="0" max="999" enterkeyhint="done" data-group="2" aria-label="第二隊分數">
                <button class="score-step down btn-red" data-group="2" data-delta="-1" aria-label="第二隊減一分"></button>
            </div>
        </div>
        <div class="team-card" id="t3">
            <span class="team-label">第三隊</span>
            <div class="score-editor">
                <button class="score-step up btn-green" data-group="3" data-delta="1" aria-label="第三隊加一分"></button>
                <input class="score-box" type="number" min="0" max="999" enterkeyhint="done" data-group="3" aria-label="第三隊分數">
                <button class="score-step down btn-red" data-group="3" data-delta="-1" aria-label="第三隊減一分"></button>
            </div>
        </div>
        <div class="team-card" id="t4">
            <span class="team-label">第四隊</span>
            <div class="score-editor">
                <button class="score-step up btn-green" data-group="4" data-delta="1" aria-label="第四隊加一分"></button>
                <input class="score-box" type="number" min="0" max="999" enterkeyhint="done" data-group="4" aria-label="第四隊分數">
                <button class="score-step down btn-red" data-group="4" data-delta="-1" aria-label="第四隊減一分"></button>
            </div>
        </div>
    </main>

    <section class="control-container">
        <!-- Rounds -->
        <div class="control-card">
            <h2 class="card-title">發題 / 收卷</h2>
            <p id="quiz_status" class="card-subtitle">尚未發題</p>

            <div class="input-row">
                <label for="quiz_song">題目</label>
                <select id="quiz_song"></select>
            </div>

            <a id="youtube_link" class="youtube-link" target="_blank" rel="noopener noreferrer" hidden></a>

            <button id="open_btn" class="mc-button btn-green">發題</button>
            <button id="close_btn" class="mc-button btn-gold">收卷並計分</button>
        </div>

        <!-- Group codes -->
        <div class="control-card">
            <h2 class="card-title">組別代碼</h2>
            <p class="card-subtitle">玩家輸入代碼就會進到那一組；不分大小寫、各組不能重複，留空 = 該組不能加入</p>
            <div id="group_passwords" class="password-grid"></div>
            <button id="save_pw_btn" class="mc-button btn-gold">儲存代碼</button>
        </div>

        <!-- Answers -->
        <div class="control-card wide-card">
            <h2 class="card-title">作答狀況</h2>
            <p id="answer_key" class="card-subtitle"></p>
            <p id="answer_summary" class="card-subtitle"></p>
            <p class="card-subtitle">點分數可以人工改判（年份 +3 → +1 → +0 輪流切換），切回原本的分數就是還原；收卷後改判會自動加減分</p>
            <div class="table-wrap">
                <table class="answer-table">
                    <thead>
                        <tr><th>組</th><th>名字</th><th>年份</th><th>歌手</th><th>歌名</th></tr>
                    </thead>
                    <tbody id="answer_rows"></tbody>
                </table>
            </div>
        </div>

        <!-- Song list -->
        <div class="control-card wide-card">
            <h2 class="card-title">歌單與解答</h2>
            <p class="card-subtitle">
                JSON 陣列，格式見 songs.example.json；歌手、歌名可以填多種寫法。
                解答只存在伺服器，比賽開始後請不要調換順序。
            </p>
            <input id="songs_file" type="file" accept=".json,application/json">
            <textarea id="songs_json" class="songs-json" rows="10" spellcheck="false"></textarea>
            <button id="save_songs_btn" class="mc-button btn-gold">儲存歌單</button>
        </div>

        <!-- Reset -->
        <div class="control-card wide-card">
            <h2 class="card-title">重置所有資料</h2>
            <p class="card-subtitle">清空四組分數、歌單與解答、組別代碼、所有作答紀錄。無法復原，比賽前或比賽後再用。</p>
            <button id="reset_btn" class="mc-button btn-red">重置資料庫與分數</button>
        </div>

        <!-- Logout -->
        <div class="logout-wrapper">
            <button id="logout_btn" class="mc-button btn-red">登出系統</button>
        </div>

    </section>
</body>
</html>
