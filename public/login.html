<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三『資』小豬 - 登入</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    <script src="/js/login.js" defer></script>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <header class="top-header">
        <a class="header-title" href="/">誰是猜歌王</a>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2 class="login-title">系統登入</h2>
            
            <div class="input-group">
                <label for="username">帳號</label>
                <input id="username" type="text" autocomplete="off" placeholder="請輸入帳號">
            </div>
            
            <div class="input-group">
                <label for="password">密碼</label>
                <input id="password" type="password" placeholder="請輸入密碼">
            </div>

            <button id="submit" type="submit" class="mc-button">登入</button>
        </div>
    </main>
</body>
</html>
